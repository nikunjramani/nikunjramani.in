# Production runtime config for the `api` Cloud Run service — non-secret, read by
# the Makefile's `deploy-api` (`gcloud run deploy --env-vars-file`). Secrets (RESEND_API_KEY,
# CONTACT_EMAIL_TO) come from Secret Manager, bound by the same target.
GOOGLE_CLOUD_PROJECT: nikunjramani-in
ENVIRONMENT: production
# The service's own URL: the audience of the tokens Eventarc and Cloud Scheduler send to
# /internal/* (kernel/events.py). Comma-separated if Eventarc signs for another of its URLs.
SERVICE_URL: https://api-555631156536.asia-south1.run.app
ALLOWED_ORIGINS: https://nikunjramani.in,https://www.nikunjramani.in
SITE_URL: https://nikunjramani.in
STORAGE_BUCKET: nikunjramani-in-media
BACKUPS_BUCKET: nikunjramani-in-backups
MAIL_FROM: no-reply@nikunjramani.in
