[project]
name = "nikunjramani-functions"
version = "0.1.0"
description = "Cloud Functions for Firebase — nikunjramani.in"
requires-python = ">=3.13"
dependencies = [
    "firebase-functions>=0.4.2",
    "firebase-admin>=6.5.0",
    "fastapi>=0.115.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "a2wsgi>=1.10.0",
    "httpx>=0.27.0",
    "python-slugify>=8.0.0",
    "pillow>=10.4.0",
    "blurhash-python>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "import-linter>=2.0",
    "debugpy>=1.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["shared/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# "profile" is the correct, meaningful domain name here — it matches the Firestore
# collection and the Profile schema used everywhere else. It's nested under src/, not a
# top-level module, so it doesn't actually shadow the stdlib profiler in practice.
"src/profile/**" = ["A005"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
# `exclude` only applies to mypy's own directory-discovery, and is a no-op once a directory
# is passed explicitly on the command line (which `make lint` does) or once a file outside
# the excluded path imports one inside it. The override below is what actually keeps
# generated code out of strict checking regardless of invocation style.
exclude = ["shared/generated", "\\.venv"]

[[tool.mypy.overrides]]
module = "shared.generated.*"
ignore_errors = true

# firebase_functions, a2wsgi, flask and google.auth all ship their own py.typed — real type
# info, verified by hand rather than assumed (checking for a literal py.typed file is what
# ADR 0003's implementation note is about: guessing here once already produced false
# "not defined" errors from an over-broad ignore). firebase_admin and google.cloud.storage
# nor does blurhash-python. All three need this.
[[tool.mypy.overrides]]
module = ["firebase_admin.*", "google.cloud.storage.*", "blurhash.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# "shared" is deliberate, not a typo of "src" — shared/repositories and shared/services
# have their own tests/ directories too, and both need discovering by a bare `pytest`.
# "tests" (top-level, not under shared/ or src/) holds cross-domain wiring tests that
# import from multiple src.<domain> packages — import-linter forbids that from shared/.
testpaths = ["src", "shared", "tests"]
addopts = "-q --cov=src --cov=shared --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
# Generated models are not our code to test — the schemas and fixtures cover them.
omit = ["shared/generated/*", "*/tests/*"]

# ── Domain boundaries — see ADR 0011 ────────────────────────────────
# These two rules are load-bearing. `make lint` runs them.
[tool.importlinter]
root_packages = ["shared", "src"]

[[tool.importlinter.contracts]]
name = "shared/ must never import from src/"
type = "forbidden"
source_modules = ["shared"]
forbidden_modules = ["src"]

# ⚠️ Every new domain must be added to this list, or it is silently unchecked.
[[tool.importlinter.contracts]]
name = "domains must not import each other"
type = "independence"
modules = [
    "src.system",
    "src.contact",
    "src.projects",
    "src.skills",
    "src.experience",
    "src.education",
    "src.certifications",
    "src.posts",
    "src.profile",
    "src.settings",
    "src.media",
    "src.messages",
]
