[project]
name = "nikunjramani-functions"
version = "0.1.0"
description = "Cloud Functions for Firebase — nikunjramani.in"
requires-python = ">=3.13"
dependencies = [
    "firebase-functions>=0.4.2",
    "firebase-admin>=6.5.0",
    "fastapi>=0.115.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "a2wsgi>=1.10.0",
    "httpx>=0.27.0",
    "python-slugify>=8.0.0",
    "pillow>=10.4.0",
    "blurhash-python>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "import-linter>=2.0",
    "debugpy>=1.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["shared/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# "profile" is the correct, meaningful domain name here — it matches the Firestore
# collection and the Profile schema used everywhere else. It's nested under src/, not a
# top-level module, so it doesn't actually shadow the stdlib profiler in practice.
"src/content/profile/**" = ["A005"]
# kernel/logging.py and kernel/http.py are kernel-namespaced, never top-level imports.
"kernel/**" = ["A005"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
# No __init__.py anywhere but the generated models (ADR 0017): module names come from the
# path relative to this directory, so the many main.py / service.py files stay distinct.
explicit_package_bases = true
# `exclude` only applies to mypy's own directory-discovery, and is a no-op once a directory
# is passed explicitly on the command line (which `make lint` does) or once a file outside
# the excluded path imports one inside it. The override below is what actually keeps
# generated code out of strict checking regardless of invocation style.
exclude = ["shared/generated", "\\.venv"]

[[tool.mypy.overrides]]
module = "shared.generated.*"
ignore_errors = true

# firebase_functions, a2wsgi, flask and google.auth all ship their own py.typed — real type
# info, verified by hand rather than assumed (checking for a literal py.typed file is what
# ADR 0003's implementation note is about: guessing here once already produced false
# "not defined" errors from an over-broad ignore). firebase_admin and google.cloud.storage
# nor does blurhash-python. All three need this.
[[tool.mypy.overrides]]
module = ["firebase_admin.*", "google.cloud.storage.*", "blurhash.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# All tests live under tests/, mirroring src/ and kernel/. importlib mode because there are
# no __init__.py files and test names repeat across subdomains (tests/*/*/test_service.py).
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib --cov=src --cov=kernel --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
# Generated models are not our code to test — the schemas and fixtures cover them.
omit = ["shared/generated/*"]

# ── Domain boundaries — see ADR 0017 and README.md ─────────────────
# Load-bearing. `make lint` runs them; tests/test_domain_registry.py checks every domain
# and subdomain on disk appears in the independence contracts below, and
# tests/test_import_rules.py keeps the Firestore SDK out of routes and services.
[tool.importlinter]
root_packages = ["kernel", "shared", "src"]

[[tool.importlinter.contracts]]
name = "kernel is infrastructure: it imports no domain"
type = "forbidden"
source_modules = ["kernel"]
forbidden_modules = ["src"]

[[tool.importlinter.contracts]]
name = "shared holds generated models only: it imports nothing of ours"
type = "forbidden"
source_modules = ["shared"]
forbidden_modules = ["src", "kernel"]

[[tool.importlinter.contracts]]
name = "main domains never import each other"
type = "independence"
modules = ["src.content", "src.identity", "src.inbox", "src.media", "src.ops"]

[[tool.importlinter.contracts]]
name = "content subdomains never import each other"
type = "independence"
modules = [
    "src.content.certifications",
    "src.content.education",
    "src.content.experience",
    "src.content.posts",
    "src.content.profile",
    "src.content.projects",
    "src.content.settings",
    "src.content.skills",
]

[[tool.importlinter.contracts]]
name = "inbox subdomains never import each other"
type = "independence"
modules = ["src.inbox.contact", "src.inbox.messages", "src.inbox.notifications"]

[[tool.importlinter.contracts]]
name = "media subdomains never import each other"
type = "independence"
modules = ["src.media.library", "src.media.processing", "src.media.upload"]

[[tool.importlinter.contracts]]
name = "ops subdomains never import each other"
type = "independence"
modules = ["src.ops.audit", "src.ops.backup", "src.ops.health"]

[[tool.importlinter.contracts]]
name = "subdomain layers: main -> routes -> schemas -> service -> repository"
type = "layers"
layers = ["main", "(routes)", "(schemas)", "(service)", "(repository)"]
containers = [
    "src.content.certifications",
    "src.content.education",
    "src.content.experience",
    "src.content.posts",
    "src.content.profile",
    "src.content.projects",
    "src.content.settings",
    "src.content.skills",
    "src.identity.admins",
    "src.inbox.contact",
    "src.inbox.messages",
    "src.inbox.notifications",
    "src.media.library",
    "src.media.processing",
    "src.media.upload",
    "src.ops.audit",
    "src.ops.backup",
    "src.ops.health",
]
