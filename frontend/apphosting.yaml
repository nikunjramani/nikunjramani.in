# Firebase App Hosting runtime config for the Next.js frontend.
# See docs/RUNBOOK.md (App Hosting), ADR 0013 and docs/plan/04-infrastructure.md.
#
# NEXT_PUBLIC_* values are public by design (security is in Firestore rules, not in
# hiding this config) — safe to commit plaintext. This app reads no secrets.

runConfig:
  minInstances: 0
  maxInstances: 3

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyCVgOxNSC5fPg5YIww2VJE7SgBxG9ZLXDM"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "nikunjramani-in.firebaseapp.com"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "nikunjramani-in"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "nikunjramani-in-media"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:555631156536:web:e45f1ff9bebbb428a975cd"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_SITE_URL
    value: "https://nikunjramani.in"
    availability: [BUILD, RUNTIME]

  # Next.js serializes rewrites at build time, so this must be available during BUILD.
  - variable: FUNCTIONS_BASE_URL
    value: "https://asia-south1-nikunjramani-in.cloudfunctions.net"
    availability: [BUILD, RUNTIME]

  # FIREBASE_SERVICE_ACCOUNT is deliberately absent — App Hosting's runtime service
  # account (apphosting-runtime@..., read-only) provides ambient credentials; see
  # frontend/src/lib/firebase/admin.ts.

  # reCAPTCHA Enterprise key behind App Check on the contact form (ADR 0020) — public by
  # design, restricted to this site's domains. `terraform output recaptcha_site_key`.
  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    value: "6LeZdfEtAAAAAO9YGAIwR-lLdmIOSyS_eFULqKlT"
    availability: [BUILD, RUNTIME]
