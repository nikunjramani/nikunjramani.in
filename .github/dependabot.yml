# Weekly, grouped: one PR per ecosystem rather than one per package.
#
# npm majors are skipped: they've proven to need code changes, not bumps (zod 3→4 breaks the
# generated schemas and the admin form; the $ref resolver's major breaks `make gen`). A grouped
# PR carrying one of them can never go green, which blocks every safe update with it. Do npm
# majors as deliberate migrations.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend: { patterns: ["*"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /architecture/codegen
    schedule: { interval: weekly }
    groups:
      codegen: { patterns: ["*"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /backend/functions
    schedule: { interval: weekly }
    groups:
      backend: { patterns: ["*"] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: terraform
    directories: [/infra/terraform/envs/prod, /infra/terraform/envs/staging]
    schedule: { interval: weekly }
    groups:
      terraform: { patterns: ["*"] }
