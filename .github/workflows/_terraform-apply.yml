name: terraform-apply

# `terraform apply` for one environment as its github-terraform identity, which only a job in
# the given GitHub environment can obtain — production-infra requires approval (ADR 0019).

on:
  workflow_call:
    inputs:
      env:
        description: "prod | staging — the directory under infra/terraform/envs"
        type: string
        required: true
      github_environment:
        description: "staging-infra | production-infra"
        type: string
        required: true
    secrets:
      TF_VAR_BILLING_ACCOUNT:
        required: true
      TF_VAR_ALERT_EMAIL:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    env:
      TF_VAR_billing_account: ${{ secrets.TF_VAR_BILLING_ACCOUNT }}
      TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
      TF_IN_AUTOMATION: "1"
    defaults:
      run:
        working-directory: infra/terraform/envs/${{ inputs.env }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_SA }}
      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve -lock-timeout=300s
