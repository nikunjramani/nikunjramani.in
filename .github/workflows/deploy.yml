name: deploy

# Push to main deploys production. Off unless the repository variable PROD_DEPLOY_ENABLED is
# "true" (RUNBOOK, "Turning on production deploys").
#
# A push deploys only the parts it changed — a docs-only push deploys nothing. A manual run
# deploys everything.
#
# Order: deploy (rules → functions → App Hosting → smoke test) → rollback if that failed →
# terraform apply when infra/terraform changed, staging then prod (prod behind approval).
# Code goes first because Firebase makes a new HTTP function public on create, while
# Terraform's invoker binding fails on a function that doesn't exist yet. A change that adds a
# *secret* is the exception: run this workflow manually with infra_only first.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      infra_only:
        description: "Only run terraform apply (e.g. to create a new secret before code binds it)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false # never cancel a half-finished prod deploy

jobs:
  changes:
    if: vars.PROD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # The filter only runs on push; a manual run deploys every target.
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      rules: ${{ github.event_name != 'push' || steps.filter.outputs.rules == 'true' }}
      functions: ${{ github.event_name != 'push' || steps.filter.outputs.functions == 'true' }}
      apphosting: ${{ github.event_name != 'push' || steps.filter.outputs.apphosting == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the filter diffs against github.event.before
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'push'
        id: filter
        with:
          base: ${{ github.event.before }}
          # Same deploy targets as pr.yml.
          filters: |
            ci: &ci
              - .github/**
            infra:
              - infra/terraform/**
            rules:
              - *ci
              - infra/rules/**
              - firebase.json
              - .firebaserc
            functions:
              - *ci
              - architecture/**
              - backend/**
              - firebase.json
              - .firebaserc
            apphosting:
              - *ci
              - architecture/**
              - frontend/**
              - firebase.json
              - .firebaserc

  deploy:
    needs: changes
    if: >
      !inputs.infra_only
      && (needs.changes.outputs.rules == 'true' || needs.changes.outputs.functions == 'true'
          || needs.changes.outputs.apphosting == 'true')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/firebase-deploy
        with:
          project: default
          rules: ${{ needs.changes.outputs.rules }}
          functions: ${{ needs.changes.outputs.functions }}
          apphosting: ${{ needs.changes.outputs.apphosting }}
          url: ${{ vars.SITE_URL }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

  # A failed deploy or smoke test redeploys the previous commit. Terraform isn't rolled back —
  # infra changes are reviewed in the approval step and are rarely what breaks a deploy.
  rollback:
    needs: deploy
    if: >
      always() && github.event_name == 'push'
      && needs.deploy.result == 'failure'
      && github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      # The previous commit's code, all of it, deployed by the current commit's action.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.before }}
      - uses: actions/checkout@v7
        with:
          path: .ci
          sparse-checkout: .github/actions
      - uses: ./.ci/.github/actions/firebase-deploy
        with:
          project: default
          url: ${{ vars.SITE_URL }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

  terraform:
    name: terraform (${{ matrix.env }})
    needs: [changes, deploy]
    if: >
      always() && needs.changes.result == 'success'
      && (inputs.infra_only || (needs.changes.outputs.infra == 'true'
          && contains(fromJSON('["success","skipped"]'), needs.deploy.result)))
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1 # staging first — it's the rehearsal; a failure there stops prod
      matrix:
        include:
          - env: staging
            github_environment: staging-infra
          - env: prod
            github_environment: production-infra # required reviewer (ADR 0019)
    environment: ${{ matrix.github_environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/terraform-apply
        with:
          env: ${{ matrix.env }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_SA }}
          billing_account: ${{ secrets.TF_VAR_BILLING_ACCOUNT }}
          alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
