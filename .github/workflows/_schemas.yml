name: schemas

# Schemas validate, and the committed generated code matches `make gen` (ADR 0006).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: architecture/codegen/package-lock.json
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: npm ci --prefix architecture/codegen
      - run: make validate
      - run: make gen
      # Without this, the schemas quietly stop being the source of truth.
      - name: Fail if generated code is stale
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated code is out of date. Run 'make gen' and commit the result."
            exit 1
          fi
