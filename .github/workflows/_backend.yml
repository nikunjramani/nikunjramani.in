name: backend

# Lint (ruff, mypy --strict, import-linter) and the full test suite on the Firestore emulator.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/functions/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6 # the Firestore emulator is a Java program
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1
      - run: npm install -g firebase-tools
      - run: uv sync --all-extras --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy .
          uv run lint-imports
      - name: Test against the Firestore emulator
        working-directory: .
        env:
          REQUIRE_FIRESTORE_EMULATOR: "1" # a broken emulator start fails, not skips
        run: >
          firebase emulators:exec --only firestore --project nikunjramani-in
          "cd backend/functions && uv run pytest"
