name: firebase-deploy

# One `firebase deploy` + smoke test, shared by the staging preview, the production deploy and
# its rollback. Runs as the given GitHub environment's github-deploy identity (ADR 0019).

on:
  workflow_call:
    inputs:
      environment:
        description: "staging | production — selects WIF_PROVIDER / DEPLOY_SA"
        type: string
        required: true
      project:
        type: string
        required: true
      url:
        description: "Site URL — the environment link and the smoke-test target"
        type: string
        required: true
      only:
        description: "firebase deploy --only targets"
        type: string
        required: true
      ref:
        description: "Commit to deploy; empty deploys the triggering commit (set for rollback)"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/firebase-setup
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      # Retried: a fresh project's first deploys hit documented propagation races (Eventarc
      # service agent, gcf-artifacts repo, source bucket) whose remedy is "retry in a few minutes".
      - name: Deploy
        env:
          PROJECT: ${{ inputs.project }}
          ONLY: ${{ inputs.only }}
        run: |
          for attempt in 1 2 3; do
            firebase deploy --project "$PROJECT" --only "$ONLY" --non-interactive --force && exit 0
            [ "$attempt" -lt 3 ] && { echo "::warning::Deploy attempt $attempt failed; retrying in 90s"; sleep 90; }
          done
          exit 1
      - name: Smoke test
        env:
          URL: ${{ inputs.url }}
        run: |
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null "$URL/"
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$URL/api/v1/ops/health"
