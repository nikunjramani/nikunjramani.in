name: pr

# Every pull request: decide what changed, run the matching checks, gate merging on one
# `checks` result, then deploy a preview to the staging project (ADR 0018).
#
# The work lives in reusable workflows (_*.yml); this file only wires them together. They stay
# jobs of this one workflow because a required check in a separate path-filtered workflow
# never reports on PRs outside its paths — and blocks them forever.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      schemas: ${{ steps.filter.outputs.schemas }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      deployable: ${{ steps.filter.outputs.deployable }}
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # A workflow or action change runs everything, so it's proven by the jobs it affects.
          filters: |
            ci: &ci
              - .github/workflows/**
              - .github/actions/**
            schemas:
              - *ci
              - architecture/**
              - backend/functions/shared/generated/**
              - frontend/src/generated/**
            backend:
              - *ci
              - architecture/**
              - backend/**
              - firebase.json
            frontend:
              - *ci
              - architecture/**
              - frontend/**
            infra:
              - *ci
              - infra/terraform/**
            deployable:
              - *ci
              - architecture/**
              - backend/**
              - frontend/**
              - infra/rules/**
              - firebase.json
              - .firebaserc

  # ── checks ──────────────────────────────────────────────────────────
  schemas:
    needs: changes
    if: needs.changes.outputs.schemas == 'true'
    uses: ./.github/workflows/_schemas.yml

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/_backend.yml

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/_frontend.yml

  infra-plan:
    name: infra-plan (${{ matrix.env }})
    needs: changes
    if: needs.changes.outputs.infra == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: prod
            wif_provider: ${{ vars.PROD_WIF_PROVIDER }}
            plan_sa: ${{ vars.PROD_PLAN_SA }}
          - env: staging
            wif_provider: ${{ vars.STAGING_WIF_PROVIDER }}
            plan_sa: ${{ vars.STAGING_PLAN_SA }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/_terraform-plan.yml
    with:
      env: ${{ matrix.env }}
      workload_identity_provider: ${{ matrix.wif_provider }}
      service_account: ${{ matrix.plan_sa }}
    secrets:
      TF_VAR_BILLING_ACCOUNT: ${{ secrets.TF_VAR_BILLING_ACCOUNT }}
      TF_VAR_ALERT_EMAIL: ${{ secrets.TF_VAR_ALERT_EMAIL }}

  # The one required status check (branch protection): skipped is fine, failed is not.
  checks:
    needs: [changes, schemas, backend, frontend, infra-plan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done

  # ── preview ─────────────────────────────────────────────────────────
  # After every check passed, for same-repo PRs that change something deployable. Fork PRs
  # get no OIDC token, so they never reach staging.
  preview:
    needs: [changes, checks]
    if: >
      always() && !failure() && !cancelled()
      && needs.changes.outputs.deployable == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: staging # one shared slot (ADR 0018); the newest push wins
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_firebase-deploy.yml
    with:
      environment: staging
      project: nikunjramani-in-staging
      url: https://nikunjramani-in--nikunjramani-in-staging.asia-southeast1.hosted.app
      only: firestore:rules,firestore:indexes,functions,apphosting

  preview-report:
    needs: preview
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      URL: https://nikunjramani-in--nikunjramani-in-staging.asia-southeast1.hosted.app
    steps:
      # Report-only: scores land in the run's artifacts, nothing fails on them. Staging is
      # noindex and scales to zero, so its SEO and performance numbers aren't prod's anyway.
      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ env.URL }}/
          runs: 3
          uploadArtifacts: true
      - name: Comment the preview link on the PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: staging-preview
          message: |
            ### Staging preview
            **${{ env.URL }}** — deployed from `${{ github.event.pull_request.head.sha }}`

            This is the shared **staging** project (`nikunjramani-in-staging`), not production.
            It holds placeholder data only, and the next PR push to deploy replaces it (ADR 0018).
