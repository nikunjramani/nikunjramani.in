name: pr

# Every pull request: the checks that gate merging, then a preview deploy to the staging
# project (ADR 0018). One workflow on purpose — jobs skipped by the path filter still report
# as passing, so they can be required checks without blocking unrelated PRs.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      schemas: ${{ steps.filter.outputs.schemas }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      deployable: ${{ steps.filter.outputs.deployable }}
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            schemas:
              - architecture/**
              - backend/functions/shared/generated/**
              - frontend/src/generated/**
            backend:
              - architecture/**
              - backend/**
              - firebase.json
            frontend:
              - architecture/**
              - frontend/**
            infra:
              - infra/terraform/**
            deployable:
              - architecture/**
              - backend/**
              - frontend/**
              - infra/rules/**
              - firebase.json
              - .firebaserc
              - .github/workflows/pr.yml

  # ── checks ──────────────────────────────────────────────────────────
  schemas:
    needs: changes
    if: needs.changes.outputs.schemas == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: architecture/codegen/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: npm ci --prefix architecture/codegen
      - run: make validate
      - run: make gen
      # Without this, the schemas quietly stop being the source of truth (ADR 0006).
      - name: Fail if generated code is stale
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated code is out of date. Run 'make gen' and commit the result."
            exit 1
          fi

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/functions/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4 # the Firestore emulator is a Java program
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1
      - run: npm install -g firebase-tools
      - run: uv sync --all-extras --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy .
          uv run lint-imports
      - name: Test against the Firestore emulator
        working-directory: .
        env:
          REQUIRE_FIRESTORE_EMULATOR: "1"
        run: >
          firebase emulators:exec --only firestore --project nikunjramani-in
          "cd backend/functions && uv run pytest"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Public by design (apphosting.yaml); the build needs them, nothing secret here.
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: nikunjramani-in
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: nikunjramani-in.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: nikunjramani-in-media
      NEXT_PUBLIC_SITE_URL: https://nikunjramani.in
      FUNCTIONS_BASE_URL: https://asia-south1-nikunjramani-in.cloudfunctions.net
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test --if-present
      - run: npm run build

  infra-plan:
    needs: changes
    if: needs.changes.outputs.infra == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: prod
            wif_provider: PROD_WIF_PROVIDER
            plan_sa: PROD_PLAN_SA
          - env: staging
            wif_provider: STAGING_WIF_PROVIDER
            plan_sa: STAGING_PLAN_SA
    env:
      TF_VAR_billing_account: ${{ secrets.TF_VAR_BILLING_ACCOUNT }}
      TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
      TF_IN_AUTOMATION: "1"
    defaults:
      run:
        working-directory: infra/terraform/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive ../..
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars[matrix.wif_provider] }}
          service_account: ${{ vars[matrix.plan_sa] }}
      - run: terraform init -input=false
      - run: terraform validate
      - name: Plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=120s 2>&1 | tee plan.txt
      - name: Format the plan for the PR comment
        if: always() && steps.plan.outcome != 'skipped'
        env:
          OUTCOME: ${{ steps.plan.outcome }}
        run: |
          {
            echo "### \`terraform plan\` · ${{ matrix.env }} · ${OUTCOME}"
            echo
            grep -E '^Plan:|^No changes' plan.txt || true
            echo
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
            echo '</details>'
          } > comment.md
      - name: Comment the plan on the PR
        if: always() && steps.plan.outcome != 'skipped'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: infra-plan-${{ matrix.env }}
          path: infra/terraform/envs/${{ matrix.env }}/comment.md

  # The one required status check (branch protection). Matrix and path-skipped jobs report
  # under shifting names, so they're rolled up here: skipped is fine, failed is not.
  checks:
    needs: [changes, schemas, backend, frontend, infra-plan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done

  # ── preview ─────────────────────────────────────────────────────────
  preview:
    needs: [changes, checks]
    # Deploy only when every check that ran passed, for same-repo PRs that change something
    # deployable. Fork and Dependabot PRs get no OIDC token, so they never reach staging.
    if: >
      always() && !failure() && !cancelled()
      && needs.changes.outputs.deployable == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.url.outputs.url }}
    concurrency:
      group: staging # one shared slot (ADR 0018); the newest push wins
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      PROJECT: nikunjramani-in-staging
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/firebase-setup
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - name: Deploy rules, functions and App Hosting to staging
        run: >
          firebase deploy --project "$PROJECT" --non-interactive --force
          --only firestore:rules,firestore:indexes,functions,apphosting
      - id: url
        run: echo "url=https://nikunjramani-in--nikunjramani-in-staging.asia-southeast1.hosted.app" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        env:
          URL: ${{ steps.url.outputs.url }}
        run: |
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null "$URL/"
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$URL/api/v1/ops/health"
      # Report-only: scores land in the run's artifacts, nothing fails on them. Staging is
      # noindex and scales to zero, so its SEO and performance numbers aren't prod's anyway.
      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.url.outputs.url }}/
          runs: 3
          uploadArtifacts: true
      - name: Comment the preview link on the PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: staging-preview
          message: |
            ### Staging preview
            **${{ steps.url.outputs.url }}** — deployed from `${{ github.event.pull_request.head.sha }}`

            This is the shared **staging** project (`${{ env.PROJECT }}`), not production. It holds
            placeholder data only, and the next PR push to deploy replaces it (ADR 0018).
