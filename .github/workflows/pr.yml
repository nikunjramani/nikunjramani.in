name: pr

# Every pull request: run the checks for what changed, gate merging on one `checks` result,
# then deploy a preview to the staging project (ADR 0018). Each job's steps live in a
# composite action under .github/actions/.
#
# Config comes from its source, not from this file: project IDs from .firebaserc aliases,
# site URLs from each GitHub environment's SITE_URL variable, frontend build env from
# frontend/apphosting.yaml.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      schemas: ${{ steps.filter.outputs.schemas }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      deployable: ${{ steps.filter.outputs.deployable }}
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # A CI change runs everything, so it's proven by the jobs it affects.
          filters: |
            ci: &ci
              - .github/**
            schemas:
              - *ci
              - architecture/**
              - backend/functions/shared/generated/**
              - frontend/src/generated/**
            backend:
              - *ci
              - architecture/**
              - backend/**
              - firebase.json
              - .firebaserc
            frontend:
              - *ci
              - architecture/**
              - frontend/**
            infra:
              - *ci
              - infra/terraform/**
            deployable:
              - *ci
              - architecture/**
              - backend/**
              - frontend/**
              - infra/rules/**
              - firebase.json
              - .firebaserc

  # ── checks ──────────────────────────────────────────────────────────
  schemas:
    needs: changes
    if: needs.changes.outputs.schemas == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/schema-check

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/backend-checks

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/frontend-checks

  infra-plan:
    name: infra-plan (${{ matrix.env }})
    needs: changes
    if: needs.changes.outputs.infra == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: prod
            wif_provider: ${{ vars.PROD_WIF_PROVIDER }}
            plan_sa: ${{ vars.PROD_PLAN_SA }}
          - env: staging
            wif_provider: ${{ vars.STAGING_WIF_PROVIDER }}
            plan_sa: ${{ vars.STAGING_PLAN_SA }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/terraform-plan
        with:
          env: ${{ matrix.env }}
          workload_identity_provider: ${{ matrix.wif_provider }}
          service_account: ${{ matrix.plan_sa }}
          billing_account: ${{ secrets.TF_VAR_BILLING_ACCOUNT }}
          alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}

  # The one required status check (branch protection): skipped is fine, failed is not.
  checks:
    needs: [changes, schemas, backend, frontend, infra-plan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done

  # ── preview ─────────────────────────────────────────────────────────
  # After every check passed, for same-repo PRs that change something deployable. Fork PRs
  # get no OIDC token, so they never reach staging.
  preview:
    needs: [changes, checks]
    if: >
      always() && !failure() && !cancelled()
      && needs.changes.outputs.deployable == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: staging # one shared slot (ADR 0018); the newest push wins
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/firebase-deploy
        with:
          project: staging
          only: firestore:rules,firestore:indexes,functions,apphosting
          url: ${{ vars.SITE_URL }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      # Report-only: scores land in the run's artifacts, nothing fails on them. Staging is
      # noindex and scales to zero, so its SEO and performance numbers aren't prod's anyway.
      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ vars.SITE_URL }}/
          runs: 3
          uploadArtifacts: true
      - name: Comment the preview link on the PR
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: staging-preview
          message: |
            ### Staging preview
            **${{ vars.SITE_URL }}** — deployed from `${{ github.event.pull_request.head.sha }}`

            This is the shared **staging** project, not production. It holds placeholder data
            only, and the next PR push to deploy replaces it (ADR 0018).
