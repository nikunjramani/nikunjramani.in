name: firebase-deploy
description: >
  Toolchain, keyless auth, `firebase deploy` of rules and App Hosting (retried) and a smoke
  test — shared by the staging preview, the production deploy and its rollback. The API is
  deployed by cloud-run-deploy, before this runs. The project comes from a .firebaserc alias,
  so no project ID is hard-coded in CI.

inputs:
  project:
    description: ".firebaserc alias — staging | default"
    required: true
  # What to deploy. Workflows pass their paths-filter results, so a change deploys only the
  # parts it touches; all default on. No Storage rules: the media bucket is plain Cloud Storage
  # behind IAM (Terraform's storage module), not a Firebase Storage bucket.
  rules:
    description: "Firestore rules + indexes"
    default: "true"
  apphosting:
    description: "App Hosting (the website)"
    default: "true"
  url:
    description: "Site URL to smoke-test after the deploy"
    required: true
  workload_identity_provider:
    required: true
  service_account:
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    - shell: bash
      run: npm install -g firebase-tools@15.34.0
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}
    # Retried: a fresh project's first App Hosting deploys hit documented propagation races
    # whose remedy is "retry in a few minutes".
    - name: Deploy
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        RULES: ${{ inputs.rules }}
        APPHOSTING: ${{ inputs.apphosting }}
      run: |
        targets=()
        [ "$RULES" = true ] && targets+=(firestore:rules firestore:indexes)
        [ "$APPHOSTING" = true ] && targets+=(apphosting)
        [ ${#targets[@]} -gt 0 ] || { echo "::error::Nothing to deploy"; exit 1; }
        ONLY=$(IFS=,; echo "${targets[*]}")
        echo "Deploying: $ONLY"
        for attempt in 1 2 3; do
          firebase deploy --project "$PROJECT" --only "$ONLY" --non-interactive --force && exit 0
          [ "$attempt" -lt 3 ] && { echo "::warning::Deploy attempt $attempt failed; retrying in 90s"; sleep 90; }
        done
        exit 1
    - name: Smoke test
      shell: bash
      env:
        URL: ${{ inputs.url }}
      run: |
        curl -fsS --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null "$URL/"
        curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$URL/api/v1/ops/health"
