name: firebase-deploy
description: >
  Toolchain, keyless auth, `firebase deploy` (retried) and a smoke test — shared by the staging
  preview, the production deploy and its rollback. The project comes from a .firebaserc alias,
  so no project ID is hard-coded in CI.

inputs:
  project:
    description: ".firebaserc alias — staging | default"
    required: true
  only:
    description: "firebase deploy --only targets"
    required: true
  url:
    description: "Site URL to smoke-test after the deploy"
    required: true
  workload_identity_provider:
    required: true
  service_account:
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version-file: .python-version
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        enable-cache: true
        cache-dependency-glob: backend/functions/uv.lock
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    - shell: bash
      run: npm install -g firebase-tools@15.34.0
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}
    # The Firebase CLI needs requirements.txt + a stdlib venv/ to load the Python functions.
    - shell: bash
      run: make setup-backend
    # Retried: a fresh project's first deploys hit documented propagation races (Eventarc
    # service agent, gcf-artifacts repo, source bucket) whose remedy is "retry in a few minutes".
    - name: Deploy
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        ONLY: ${{ inputs.only }}
      run: |
        for attempt in 1 2 3; do
          firebase deploy --project "$PROJECT" --only "$ONLY" --non-interactive --force && exit 0
          [ "$attempt" -lt 3 ] && { echo "::warning::Deploy attempt $attempt failed; retrying in 90s"; sleep 90; }
        done
        exit 1
    - name: Smoke test
      shell: bash
      env:
        URL: ${{ inputs.url }}
      run: |
        curl -fsS --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null "$URL/"
        curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$URL/api/v1/ops/health"
