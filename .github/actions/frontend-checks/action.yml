name: frontend-checks
description: >
  Type-check, lint, unit-test and production-build the Next.js app. Build-time env comes from
  frontend/apphosting.yaml — the same values App Hosting uses, never a second copy.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Load build env from apphosting.yaml
      shell: bash
      run: yq -r '.env[] | .variable + "=" + .value' frontend/apphosting.yaml >> "$GITHUB_ENV"
    - shell: bash
      working-directory: frontend
      run: npm ci
    # RouteContext / LayoutProps etc. are generated into .next/types — absent on a fresh checkout.
    - shell: bash
      working-directory: frontend
      run: npx next typegen
    - shell: bash
      working-directory: frontend
      run: npx tsc --noEmit
    - shell: bash
      working-directory: frontend
      run: npm run lint
    - shell: bash
      working-directory: frontend
      run: npm test --if-present
    - shell: bash
      working-directory: frontend
      run: npm run build
