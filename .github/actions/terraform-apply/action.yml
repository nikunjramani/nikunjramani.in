name: terraform-apply
description: >
  `terraform apply` for one environment as its github-terraform identity — which only a job in
  that environment's -infra GitHub environment can obtain (ADR 0019).

inputs:
  env:
    description: "prod | staging — the directory under infra/terraform/envs"
    required: true
  workload_identity_provider:
    required: true
  service_account:
    required: true
  billing_account:
    required: true
  alert_email:
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@v4
      with:
        terraform_wrapper: false
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}
    - name: Apply
      shell: bash
      working-directory: infra/terraform/envs/${{ inputs.env }}
      env:
        TF_IN_AUTOMATION: "1"
        TF_VAR_billing_account: ${{ inputs.billing_account }}
        TF_VAR_alert_email: ${{ inputs.alert_email }}
      run: |
        terraform init -input=false
        terraform apply -input=false -auto-approve -lock-timeout=300s
