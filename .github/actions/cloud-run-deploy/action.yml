name: cloud-run-deploy
description: >
  Builds the API image, pushes it to Artifact Registry and deploys it as the `api` Cloud Run
  service (ADR 0023), then smoke-tests it; a failed deploy or smoke test sends traffic back
  to the revision that was serving before. Shared by the staging preview and the production
  deploy. The project comes from a .firebaserc alias, the region and the service's shape
  from the Makefile — nothing environment-specific is written here.

inputs:
  project:
    description: ".firebaserc alias — staging | default"
    required: true
  workload_identity_provider:
    required: true
  service_account:
    required: true

runs:
  using: composite
  steps:
    - name: Resolve project and registry
      id: target
      shell: bash
      env:
        ALIAS: ${{ inputs.project }}
      run: |
        project=$(jq -er --arg a "$ALIAS" '.projects[$a]' .firebaserc)
        region=$(sed -n 's/^REGION *:= *//p' Makefile)
        echo "project=$project" >> "$GITHUB_OUTPUT"
        echo "region=$region" >> "$GITHUB_OUTPUT"
        echo "image=$region-docker.pkg.dev/$project/backend/api:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}
    - uses: google-github-actions/setup-gcloud@v3
    - name: Image repository
      shell: bash
      run: |
        make api-registry PROJECT="${{ steps.target.outputs.project }}"
        gcloud auth configure-docker "${{ steps.target.outputs.region }}-docker.pkg.dev" --quiet
    - uses: docker/setup-buildx-action@v4
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: backend
        push: true
        tags: ${{ steps.target.outputs.image }}
        cache-from: type=gha,scope=api
        cache-to: type=gha,mode=max,scope=api
    # Empty on the very first deploy to a project — then there is nothing to roll back to.
    - name: Remember the serving revision
      id: previous
      shell: bash
      env:
        PROJECT: ${{ steps.target.outputs.project }}
        REGION: ${{ steps.target.outputs.region }}
      run: |
        rev=$(gcloud run services describe api --project "$PROJECT" --region "$REGION" \
          --format='value(status.latestReadyRevisionName)' 2>/dev/null || true)
        echo "revision=$rev" >> "$GITHUB_OUTPUT"
    - name: Deploy
      shell: bash
      run: make deploy-api PROJECT="${{ steps.target.outputs.project }}" IMAGE="${{ steps.target.outputs.image }}"
    - name: Smoke test
      shell: bash
      env:
        PROJECT: ${{ steps.target.outputs.project }}
        REGION: ${{ steps.target.outputs.region }}
      run: |
        url=$(gcloud run services describe api --project "$PROJECT" --region "$REGION" --format='value(status.url)')
        curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$url/api/v1/ops/health"
    - name: Roll traffic back
      if: failure() && steps.previous.outputs.revision != ''
      shell: bash
      env:
        PROJECT: ${{ steps.target.outputs.project }}
        REGION: ${{ steps.target.outputs.region }}
        REVISION: ${{ steps.previous.outputs.revision }}
      run: |
        gcloud run services update-traffic api --project "$PROJECT" --region "$REGION" \
          --to-revisions "$REVISION=100" --quiet
        echo "::error::API deploy failed — traffic is back on $REVISION"
